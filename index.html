<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innenanzeige Simulator</title>
    <link rel="stylesheet" type="text/css" href="./static/style.css">
    <script type="module" src="./static/main.js"></script>
    <script type="module" src="./static/input.js"></script>
</head>

<body>
    
    <div id="matrix_frame">
        <div id="matrix">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <div id="control_box">
        <select name="line" id="line"></select>
        >
        <select name="destination" id="destination"></select>
        <select name="current_station" id="current_station"></select>
        <!--
        checkbox: selftest,left,right
        radio   : between station, at station
        button  : start/stop 'Nächste Station' animation (or as checkbox), 
                  next station control, previous station control

        range   : display size (width)
        -->

    </div>

</body>
</html>
